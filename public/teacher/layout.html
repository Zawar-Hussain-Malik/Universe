<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    display: flex;
    min-height: 100vh;
    background: #f0f3f8;
    color: #333;
    flex-direction: column;
  }

  .navbar {
    background: linear-gradient(90deg, #004080, #0055b8);
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 40px;
    position: sticky;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(10px);
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.25);
    transition: all 0.3s ease;
  }

  .navbar:hover {
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
  }

  .navbar .logo-container {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .navbar .logo-container img {
    height: 48px;
    width: 48px;
    object-fit: cover;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
  }

  .navbar h2 {
    font-size: 1.7rem;
    letter-spacing: 0.5px;
  }

  .navbar button {
    background: white;
    color: #004080;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 6px rgba(255,255,255,0.2);
  }

  .navbar button:hover {
    background: #e60000;
    color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(230, 0, 0, 0.4);
  }

  .container {
    flex: 1;
    display: flex;
    padding: 25px;
    gap: 25px;
    min-height: calc(100vh - 80px);
  }

  .sidebar {
    background: linear-gradient(180deg, rgba(0,51,102,0.9), rgba(0,80,160,0.9));
    width: 230px;
    border-radius: 16px;
    padding: 30px 0;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }

  .sidebar a {
    color: #e0ecff;
    text-decoration: none;
    padding: 14px 30px;
    font-weight: 500;
    width: 100%;
    display: block;
    position: relative;
    transition: all 0.3s ease;
  }

  .sidebar a::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0;
    background: rgba(255, 255, 255, 0.2);
    transition: width 0.3s ease;
    border-radius: 0 10px 10px 0;
  }

  .sidebar a:hover::before,
  .sidebar a.active::before {
    width: 100%;
  }

  .sidebar a:hover,
  .sidebar a.active {
    color: #fff;
    font-weight: 600;
    transform: translateX(5px);
  }

  #content {
    flex: 1;
    padding: 20px;
    min-width: 0;
  }

  @media (max-width: 768px) {
    .container {
      flex-direction: column;
      padding: 15px;
    }

    .sidebar {
      width: 100%;
      flex-direction: row;
      justify-content: space-around;
      border-radius: 12px;
      padding: 10px 0;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      overflow-x: auto;
    }

    .sidebar a {
      padding: 10px 16px;
      text-align: center;
      font-size: 0.95rem;
      border: none;
    }
  }
</style>

<div class="navbar">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Logo">
    <h2>UniVerse</h2>
  </div>
  <button id="logoutBtn">Logout</button>
</div>

<div class="container">
  <div class="sidebar">
    <a href="/teacher/dashboard">Home</a>
    <a href="/teacher/assignment">Upload Assignment</a>
    <a href="/teacher/attendance">Upload Attendance</a>
    <a href="/teacher/result">Upload Marks</a>
    <a href="/teacher/timetable">Timetable</a>
    <a href="/teacher/transport">Transport</a>
    <a href="/teacher/helpdesk">Helpdesk</a>
  </div>

  <div id="content"></div>
</div>

<script>
  document.getElementById("logoutBtn")?.addEventListener("click", () => {
    window.location.href = "/logout";
  });
</script>
